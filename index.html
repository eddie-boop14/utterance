<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>utterance · terminal</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500&display=swap');
  *{margin:0;padding:0;box-sizing:border-box;}
  html,body{height:100%;overflow:hidden;}
  body{
    background:#05060a;
    color:#9fe8c4;
    font-family:'JetBrains Mono',monospace;
    font-size:15px;
    line-height:1.7;
    height:100vh;
    display:flex;flex-direction:column;
    padding:0;
    position:relative;
  }
  /* scanline + glow, the CRT hint */
  body::before{
    content:'';position:fixed;inset:0;pointer-events:none;z-index:5;
    background:repeating-linear-gradient(transparent 0 2px,rgba(0,0,0,.12) 2px 3px);
    opacity:.5;
  }
  body::after{
    content:'';position:fixed;inset:0;pointer-events:none;z-index:4;
    background:radial-gradient(ellipse 70% 60% at 50% 45%,rgba(60,255,180,.05),transparent 70%);
  }
  #bar{
    flex-shrink:0;padding:10px 16px;border-bottom:1px solid #12241c;
    color:#3a6b55;font-size:11px;letter-spacing:.18em;text-transform:uppercase;
    display:flex;justify-content:space-between;
  }
  #bar .live{color:#9fe8c4;}
  #screen{
    flex:1;overflow:hidden;position:relative;padding:16px;
    display:flex;flex-direction:column;justify-content:flex-end;gap:2px;
    mask-image:linear-gradient(to top,#000 65%,transparent 98%);
  }
  .line{white-space:pre-wrap;word-break:break-word;animation:type .25s steps(8) both;}
  .line .who{color:#3a6b55;}
  .line .who.proven{color:#d8b56a;}
  .line.fading{animation:drift 3.2s ease-in forwards;}
  @keyframes type{from{opacity:0;}to{opacity:1;}}
  @keyframes drift{
    0%{opacity:1;transform:translateY(0);filter:blur(0);}
    100%{opacity:0;transform:translateY(-26px);filter:blur(3px);letter-spacing:.15em;}
  }
  #promptline{
    flex-shrink:0;padding:12px 16px 20px;border-top:1px solid #12241c;
    display:flex;align-items:center;gap:10px;
  }
  #sigil{color:#3a6b55;}
  #sigil.on{color:#d8b56a;}
  #prompt{color:#5fbf8f;}
  #inp{
    flex:1;background:transparent;border:none;outline:none;
    color:#cfeede;font-family:inherit;font-size:15px;caret-color:#9fe8c4;
  }
  #inp::placeholder{color:#2c4a3c;}
  .cursor{display:inline-block;width:8px;height:16px;background:#9fe8c4;
    animation:blink 1.1s steps(1) infinite;vertical-align:middle;margin-left:-4px;}
  @keyframes blink{50%{opacity:0;}}
  .hint{color:#2c4a3c;}
</style>
</head>
<body>
  <div id="bar">
    <span>utterance</span>
    <span class="live">&#9670; proven &middot; and gone</span>
  </div>
  <div id="screen"></div>
  <div id="promptline">
    <span id="sigil" title="tab to toggle signing">&#9676;</span>
    <span id="prompt">&gt;</span>
    <input id="inp" autocomplete="off" autofocus placeholder="say something — it will not stay">
  </div>

<script>
const screen=document.getElementById('inp');
const scr=document.getElementById('screen');
const inp=document.getElementById('inp');
const sigil=document.getElementById('sigil');
let signing=false;
const TTL=5200; // short in the preview so you SEE it drift away

function emit(text,who,proven){
  const l=document.createElement('div');
  l.className='line';
  const mark=proven?'<span class="who proven">&#9670; '+who+'</span>':'<span class="who">&#9676; anon</span>';
  l.innerHTML=mark+'  '+escapeHtml(text);
  scr.appendChild(l);
  setTimeout(()=>{
    l.classList.add('fading');
    setTimeout(()=>l.remove(),3200);
  },TTL);
}
function escapeHtml(s){return s.replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}

inp.addEventListener('keydown',e=>{
  if(e.key==='Tab'){e.preventDefault();signing=!signing;sigil.className=signing?'on':'';sigil.innerHTML=signing?'&#9670;':'&#9676;';return;}
  if(e.key==='Enter'){
    const v=inp.value.trim();if(!v)return;
    emit(v, signing?'a3f9c1':'anon', signing);
    inp.value='';
  }
});

// a little ambient demo so the screen isn't empty on open
const demo=[
  ['this exists only while you watch it',false],
  ['nothing is being saved',true],
  ['close the tab and it was never anywhere',false],
];
let i=0;
(function seed(){ if(i<demo.length){ emit(demo[i][0],demo[i][1]?'a3f9c1':'anon',demo[i][1]); i++; setTimeout(seed,1400);} })();
</script>
</body>
</html>
