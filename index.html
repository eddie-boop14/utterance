<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, viewport-fit=cover">
<title>utterance</title>
<script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script>
<style>
  @import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500&display=swap');
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{height:100%;overflow:hidden;}
  body{
    background:#05060a;color:#9fe8c4;
    font-family:'JetBrains Mono',monospace;font-size:14px;line-height:1.6;
    height:100dvh;display:flex;flex-direction:column;position:relative;
    padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
  }
  body::before{content:'';position:fixed;inset:0;pointer-events:none;z-index:5;
    background:repeating-linear-gradient(transparent 0 2px,rgba(0,0,0,.10) 2px 3px);opacity:.5;}
  body::after{content:'';position:fixed;inset:0;pointer-events:none;z-index:4;
    background:radial-gradient(ellipse 75% 55% at 50% 40%,rgba(60,255,180,.045),transparent 70%);}
  #bar{flex-shrink:0;padding:10px 14px;border-bottom:1px solid #12241c;
    color:#3a6b55;font-size:10px;letter-spacing:.16em;text-transform:uppercase;
    display:flex;justify-content:space-between;align-items:center;gap:8px;}
  #bar .name{color:#9fe8c4;font-weight:500;}
  #bar .creed{color:#3a6b55;white-space:nowrap;}
  #status{flex-shrink:0;padding:6px 14px;font-size:10px;letter-spacing:.12em;
    text-transform:uppercase;color:#2c4a3c;border-bottom:1px solid #0c1813;transition:color .5s;}
  #status.alive{color:#5fbf8f;}
  #screen{flex:1;overflow:hidden;position:relative;padding:14px;
    display:flex;flex-direction:column;justify-content:flex-end;gap:1px;
    mask-image:linear-gradient(to top,#000 60%,transparent 99%);}
  #empty{position:absolute;inset:0;display:flex;flex-direction:column;
    align-items:center;justify-content:center;gap:8px;pointer-events:none;text-align:center;padding:20px;}
  #empty .big{color:#1f3a2e;font-size:16px;letter-spacing:.05em;}
  #empty .small{color:#1f3a2e;font-size:10px;letter-spacing:.14em;text-transform:uppercase;}
  .line{white-space:pre-wrap;word-break:break-word;animation:appear .25s both;}
  .line .who{color:#3a6b55;}
  .line .who.proven{color:#d8b56a;}
  .line.mine .txt{color:#cfeede;}
  .line.fading{animation:drift 3s ease-in forwards;}
  @keyframes appear{from{opacity:0;}to{opacity:1;}}
  @keyframes drift{0%{opacity:1;transform:translateY(0);filter:blur(0);}
    100%{opacity:0;transform:translateY(-22px);filter:blur(3px);letter-spacing:.12em;}}
  #promptline{flex-shrink:0;padding:11px 14px;border-top:1px solid #12241c;
    display:flex;align-items:center;gap:9px;background:#070a0e;}
  #sigil{color:#3a6b55;cursor:pointer;font-size:14px;user-select:none;padding:2px;}
  #sigil.on{color:#d8b56a;}
  #caret{color:#5fbf8f;}
  #inp{flex:1;background:transparent;border:none;outline:none;
    color:#cfeede;font-family:inherit;font-size:16px;caret-color:#9fe8c4;min-width:0;}
  #inp::placeholder{color:#2c4a3c;}
  #foot{flex-shrink:0;padding:7px 14px 10px;display:flex;justify-content:space-between;
    align-items:center;gap:10px;font-size:9px;letter-spacing:.1em;text-transform:uppercase;
    color:#1f3a2e;border-top:1px solid #0c1813;}
  #shareLink{color:#2c4a3c;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;cursor:pointer;flex:1;}
  /* hidden elements the engine still expects */
  #place,#signToggle,#write,#surface,#witnesses{position:absolute;left:-9999px;width:1px;height:1px;opacity:0;}
</style>
</head>
<body>
  <div id="bar">
    <span class="name">utterance</span>
    <span class="creed">&#9670; proven &middot; and gone</span>
  </div>
  <div id="status"><span class="dot"></span>opening&hellip;</div>

  <div id="screen">
    <div id="empty">
      <div class="big">the room is quiet</div>
      <div class="small">what is said here stays here, and only here</div>
    </div>
  </div>

  <div id="promptline">
    <span id="sigil" title="tap to sign">&#9676;</span>
    <span id="caret">&gt;</span>
    <input id="inp" autocomplete="off" autocapitalize="off" autocorrect="off" autofocus placeholder="say something here">
  </div>

  <div id="foot">
    <span id="witnessReadout">&middot;</span>
    <span id="shareLink" title="tap to copy">&hellip;</span>
  </div>

  <!-- hidden shims the engine writes to; we mirror what matters into the terminal UI -->
  <div id="surface"></div>
  <button id="place"></button>
  <button id="signToggle"></button>
  <input id="write">
  <div id="witnesses"></div>

<script type="module">
// ====== ENGINE (transplanted, unchanged logic) ======
__ENGINE__
// ====== TERMINAL SKIN OVERRIDES ======
// Re-point the display functions at the terminal UI instead of the card UI.
const scr=document.getElementById('screen');
const emptyT=document.getElementById('empty');
const inpT=document.getElementById('inp');
const sigilT=document.getElementById('sigil');
const statusT=document.getElementById('status');
const witReadout=document.getElementById('witnessReadout');

function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}

// override place(): render a terminal line that drifts away
place=function(block,mine){
  if(live.has(block.id)){ const r=live.get(block.id); r.expires=Date.now()+WITNESS_TTL; r.el.classList.remove('fading'); return; }
  const el=document.createElement('div');
  el.className='line'+(mine?' mine':'');
  const who=block.sig?`<span class="who proven">&#9670; ${esc(block.pub.slice(0,6))}</span>`:`<span class="who">&#9676; anon</span>`;
  el.innerHTML=`${who}  <span class="txt">${esc(block.text)}</span>`;
  scr.appendChild(el);
  live.set(block.id,{el,expires:Date.now()+WITNESS_TTL});
  emptyT.style.display='none';
};
refreshEmpty=function(){ emptyT.style.display=live.size?'none':'flex'; };

// override setStatus()
setStatus=function(t,alive){ statusT.textContent=t; statusT.classList.toggle('alive',!!alive); };

// override renderWitnesses() -> footer readout
renderWitnesses=function(){
  for(const[pid,r]of peers){ if(!r.conn||!r.conn.open)peers.delete(pid); }
  const n=peers.size+1;
  witReadout.textContent = n===1 ? 'you alone' : n+' present';
};

// wire the terminal input to the engine's doPlace()
inpT.addEventListener('keydown',e=>{
  if(e.key==='Tab'){ e.preventDefault(); signing=!signing; if(signing)ensureKeys(); sigilT.className=signing?'on':''; sigilT.innerHTML=signing?'&#9670;':'&#9676;'; return; }
  if(e.key==='Enter'){ e.preventDefault(); const v=inpT.value.trim(); if(!v)return; document.getElementById('write').value=v; doPlace(); inpT.value=''; }
});
sigilT.addEventListener('click',()=>{ signing=!signing; if(signing)ensureKeys(); sigilT.className=signing?'on':''; sigilT.innerHTML=signing?'&#9670;':'&#9676;'; });

// doPlace reads #write; make sure the hidden write mirrors our input at send time (done above)
// share readout
const shareT=document.getElementById('shareLink');
shareT.textContent=location.href.replace(/^https?:\/\//,'');
shareT.onclick=async()=>{ try{ await navigator.clipboard.writeText(location.href); const o=shareT.textContent; shareT.textContent='copied'; setTimeout(()=>shareT.textContent=o,1500);}catch{} };

// keep input visible when the mobile keyboard opens
if(window.visualViewport){
  window.visualViewport.addEventListener('resize',()=>{ inpT.scrollIntoView({block:'end'}); });
}
renderWitnesses();
</script>
</body>
</html>
