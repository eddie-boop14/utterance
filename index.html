<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, viewport-fit=cover">
<title>utterance</title>
<script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script>
<style>
  @import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500&display=swap');
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{height:100%;overflow:hidden;}
  body{
    background:#05060a;color:#9fe8c4;
    font-family:'JetBrains Mono',monospace;font-size:14px;line-height:1.6;
    height:100dvh;display:flex;flex-direction:column;position:relative;
    padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
  }
  body::before{content:'';position:fixed;inset:0;pointer-events:none;z-index:5;
    background:repeating-linear-gradient(transparent 0 2px,rgba(0,0,0,.10) 2px 3px);opacity:.5;}
  body::after{content:'';position:fixed;inset:0;pointer-events:none;z-index:4;
    background:radial-gradient(ellipse 75% 55% at 50% 40%,rgba(60,255,180,.045),transparent 70%);}
  #bar{flex-shrink:0;padding:10px 14px;border-bottom:1px solid #12241c;
    color:#3a6b55;font-size:10px;letter-spacing:.16em;text-transform:uppercase;
    display:flex;justify-content:space-between;align-items:center;gap:8px;}
  #bar .name{color:#9fe8c4;font-weight:500;}
  #bar .creed{color:#3a6b55;white-space:nowrap;}
  #status{flex-shrink:0;padding:6px 14px;font-size:10px;letter-spacing:.12em;
    text-transform:uppercase;color:#2c4a3c;border-bottom:1px solid #0c1813;transition:color .5s;}
  #status.alive{color:#5fbf8f;}
  #screen{flex:1;overflow:hidden;position:relative;padding:14px;
    display:flex;flex-direction:column;justify-content:flex-end;gap:1px;
    mask-image:linear-gradient(to top,#000 60%,transparent 99%);}
  #empty{position:absolute;inset:0;display:flex;flex-direction:column;
    align-items:center;justify-content:center;gap:8px;pointer-events:none;text-align:center;padding:20px;}
  #empty .big{color:#1f3a2e;font-size:16px;letter-spacing:.05em;}
  #empty .small{color:#1f3a2e;font-size:10px;letter-spacing:.14em;text-transform:uppercase;}
  .line{white-space:pre-wrap;word-break:break-word;animation:appear .25s both;}
  .line .who{color:#3a6b55;}
  .line .who.proven{color:#d8b56a;}
  .line.mine .txt{color:#cfeede;}
  .line.fading{animation:drift 3s ease-in forwards;}
  @keyframes appear{from{opacity:0;}to{opacity:1;}}
  @keyframes drift{0%{opacity:1;transform:translateY(0);filter:blur(0);}
    100%{opacity:0;transform:translateY(-22px);filter:blur(3px);letter-spacing:.12em;}}
  #promptline{flex-shrink:0;padding:11px 14px;border-top:1px solid #12241c;
    display:flex;align-items:center;gap:9px;background:#070a0e;}
  #sigil{color:#3a6b55;cursor:pointer;font-size:14px;user-select:none;padding:2px;}
  #sigil.on{color:#d8b56a;}
  #caret{color:#5fbf8f;}
  #inp{flex:1;background:transparent;border:none;outline:none;
    color:#cfeede;font-family:inherit;font-size:16px;caret-color:#9fe8c4;min-width:0;}
  #inp::placeholder{color:#2c4a3c;}
  #foot{flex-shrink:0;padding:7px 14px 10px;display:flex;justify-content:space-between;
    align-items:center;gap:10px;font-size:9px;letter-spacing:.1em;text-transform:uppercase;
    color:#1f3a2e;border-top:1px solid #0c1813;}
  #shareLink{color:#2c4a3c;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;cursor:pointer;flex:1;text-transform:none;}
  /* hidden elements the engine still expects */
  #place,#signToggle,#write,#surface,#witnesses{position:absolute;left:-9999px;width:1px;height:1px;opacity:0;}
</style>
</head>
<body>
  <div id="bar">
    <span class="name">utterance</span>
    <span class="creed">&#9670; proven &middot; and gone</span>
  </div>
  <div id="status"><span class="dot"></span>opening&hellip;</div>

  <div id="screen">
    <div id="empty">
      <div class="big">the room is quiet</div>
      <div class="small">what is said here stays here, and only here</div>
    </div>
  </div>

  <div id="promptline">
    <span id="sigil" title="tap to sign">&#9676;</span>
    <span id="caret">&gt;</span>
    <input id="inp" autocomplete="off" autocapitalize="off" autocorrect="off" autofocus placeholder="say something here">
  </div>

  <div id="foot">
    <span id="witnessReadout">&middot;</span>
    <span id="build" style="color:#1f3a2e;margin:0 8px;white-space:nowrap;"></span>
    <span id="shareLink" title="tap to copy">&hellip;</span>
  </div>

  <!-- hidden shims the engine writes to; we mirror what matters into the terminal UI -->
  <div id="surface"></div>
  <button id="place"></button>
  <button id="signToggle"></button>
  <input id="write">
  <div id="witnesses"></div>

<script type="module">
// ====== ENGINE (transplanted, unchanged logic) ======
const enc=new TextEncoder();
const b64=b=>btoa(String.fromCharCode(...new Uint8Array(b))).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,'');
const unb64=s=>{s=s.replace(/-/g,'+').replace(/_/g,'/');return Uint8Array.from(atob(s),c=>c.charCodeAt(0));};
const rid=(n=12)=>b64(crypto.getRandomValues(new Uint8Array(n)));
const safe=s=>s.replace(/[^a-zA-Z0-9]/g,'').slice(0,40);

const WITNESS_TTL=14000, HEARTBEAT=3500, PRESENCE_TTL=10000;

// identity (optional proof)
let signing=false,keys=null,myPubRaw=null;
// voiceprint: a signing key's SHA-256 rendered as three words a human can say aloud.
// If the words they see match the words you speak, no one sits between you.
const VP_WORDS=['acorn','amber','anchor','apple','arrow','ash','atlas','autumn','badge','bamboo','basil','beacon','bell','birch','bison','blaze','bloom','bolt','bonsai','breeze','brick','brook','bronze','cabin','cactus','candle','canyon','cedar','chalk','cherry','cliff','cloud','clover','coal','cobalt','comet','coral','cove','crane','creek','crest','crow','dawn','delta','denim','dew','dome','drift','dune','dusk','eagle','ebony','echo','ember','fable','falcon','fern','field','fig','fjord','flame','flint','fog','forest','fox','frost','galaxy','garnet','gate','gale','glacier','glen','gold','grain','granite','grape','grove','gull','harbor','hawk','hazel','heron','hill','honey','ice','iris','iron','island','ivory','ivy','jade','jasper','jet','juniper','kelp','kite','lagoon','lake','lantern','larch','laurel','lava','leaf','ledge','lemon','lilac','lily','lime','linen','lotus','lunar','lynx','maple','marble','meadow','mesa','mint','mist','moon','moss','moth','night','ninth','north','nova','oak','oasis','ocean','olive','onyx','opal','orbit','orchid','otter','owl','palm','peak','pearl','pebble','pine','plume','polar','pond','poppy','prism','quail','quartz','quill','rain','raven','reed','ridge','river','robin','rose','ruby','rune','rust','sage','salt','sand','scout','sea','sequoia','shade','shell','shore','silver','sky','slate','snow','solar','sparrow','spring','spruce','star','stone','storm','summit','sun','swan','thistle','thorn','thunder','tide','tiger','timber','topaz','torch','trail','tulip','tundra','twig','umber','valley','vapor','velvet','vine','violet','walnut','wave','wheat','willow','wind','winter','wolf','wren','zephyr','zinc','alder','aspen','bay','briar','candle2','cinder','cliffs','coast','copper','cypress','ellipse','ferns','flare','gleam','gorge','haze','hemlock','inlet','jetty','knoll','loch','marsh','mica','nectar','nettle','oat','ochre','pond2','pika','pinecone','plume2','raft','reef','sail','shale','sled','snowcap','spark','sprig','steppe','strait','swell','talon','tarn','teal','tern','trout'];
const vpCache=new Map();
async function voiceprint(pubB64){ if(vpCache.has(pubB64))return vpCache.get(pubB64); const d=new Uint8Array(await crypto.subtle.digest('SHA-256',unb64(pubB64))); const vp=[d[0],d[1],d[2]].map(b=>VP_WORDS[b]).join(' \u00b7 '); vpCache.set(pubB64,vp); return vp; }
async function showMyMark(){ await ensureKeys(); const vp=await voiceprint(myPubRaw); setStatus('your mark \u2726 '+vp+' \u00b7 speak it to be verified',true); }
async function ensureKeys(){ if(keys)return; keys=await crypto.subtle.generateKey({name:'ECDSA',namedCurve:'P-256'},true,['sign','verify']); myPubRaw=b64(await crypto.subtle.exportKey('raw',keys.publicKey)); }
// The signed payload is bound to: room, author, text, timestamp, and a one-time nonce.
// This makes a captured signature useless elsewhere: wrong room fails, a stale timestamp
// is rejected, and a replayed nonce is caught. "Proven" now means: this author said this,
// in THIS room, ONCE, at THIS time — not just "some author signed this text sometime."
function sigPayload(o){ return [ROOM, o.pub, o.text, o.ts, o.nonce].join('\u0001'); }
async function sign(o){ return b64(await crypto.subtle.sign({name:'ECDSA',hash:'SHA-256'},keys.privateKey,enc.encode(sigPayload(o)))); }
async function verify(o){
  try{
    const pk=await crypto.subtle.importKey('raw',unb64(o.pub),{name:'ECDSA',namedCurve:'P-256'},true,['verify']);
    return await crypto.subtle.verify({name:'ECDSA',hash:'SHA-256'},pk,unb64(o.sig),enc.encode(sigPayload(o)));
  }catch{return false;}
}
const SIG_WINDOW=120000;          // a signed message older than this is rejected as stale
const usedNonces=new Map();       // nonce -> ts, to catch replays (pruned by window)
function nonceFresh(nonce,ts){
  const now=Date.now();
  if(Math.abs(now-ts)>SIG_WINDOW) return false;     // too old (or absurd future) -> stale
  if(usedNonces.has(nonce)) return false;            // already seen -> replay
  usedNonces.set(nonce,ts);
  // prune old nonces so the map can't grow unbounded
  if(usedNonces.size>500){ for(const[k,t]of usedNonces){ if(now-t>SIG_WINDOW) usedNonces.delete(k); } }
  return true;
}

// room
let ROOM=location.hash.slice(1);
if(!ROOM){ ROOM=rid(9); }
// Case-insensitive rooms: the share link gets read/typed by hand and the footer renders
// it uppercased, so normalise to one canonical case. Otherwise the rendezvous id
// (utt-<room>-host) is case-sensitive and two people "in the same room" never meet.
ROOM=ROOM.toLowerCase();
if(location.hash.slice(1)!==ROOM) location.hash=ROOM;
const ROOMKEY=safe(ROOM);
const HOST_ID='utt-'+ROOMKEY+'-host';          // deterministic rendezvous point
const MY_ID='utt-'+ROOMKEY+'-'+Math.random().toString(36).slice(2,9);

// surface
const surface=document.getElementById('surface'), emptyEl=document.getElementById('empty');
const live=new Map();
function refreshEmpty(){ emptyEl.style.display=live.size?'none':'flex'; }
function place(block,mine){
  if(live.has(block.id)){ const r=live.get(block.id); r.expires=Date.now()+WITNESS_TTL; r.el.classList.remove('fading'); return; }
  const el=document.createElement('div'); el.className='block'+(mine?' mine':'');
  const proof=block.sig?`<span class="proven">proven &middot; ${block.pub.slice(0,8)}</span>`:`<span class="anon">unsigned</span>`;
  el.innerHTML=`<div class="body"></div><div class="meta">${proof}</div>`;
  el.querySelector('.body').textContent=block.text;
  surface.appendChild(el); live.set(block.id,{el,expires:Date.now()+WITNESS_TTL}); refreshEmpty();
}
setInterval(()=>{const now=Date.now();for(const[id,r]of live){if(now>r.expires&&!r.el.classList.contains('fading')){r.el.classList.add('fading');setTimeout(()=>{r.el.remove();live.delete(id);refreshEmpty();},2800);}}},1000);
setInterval(()=>{ if(peers.size>0)for(const r of live.values())r.expires=Math.max(r.expires,Date.now()+5000); },3000);

// mesh
const statusEl=document.getElementById('status');
function setStatus(t,alive){ statusEl.childNodes[1].nodeValue=' '+t; statusEl.classList.toggle('alive',!!alive); }
const peers=new Map();   // peerId -> {conn,lastSeen}
const seen=new Set();
let peer=null, isHost=false;

function broadcast(obj,exceptId){ const d=JSON.stringify(obj); for(const[pid,r]of peers){ if(pid===exceptId)continue; try{ if(r.conn&&r.conn.open)r.conn.send(d);}catch{} } }

function wire(conn){
  conn.on('open',()=>{
    pending.delete(conn.peer);
    peers.set(conn.peer,{conn,lastSeen:Date.now()}); renderWitnesses();
    setStatus(isHost?'hosting the room · spoken together':'spoken together · direct',true);
    conn.send(JSON.stringify({t:'hello',from:MY_ID}));
    // the host introduces this newcomer to everyone else, so guests find each other
    if(isHost){
      const others=[...peers.keys()].filter(p=>p!==conn.peer);
      conn.send(JSON.stringify({t:'roster',peers:others}));
      broadcast({t:'arrive',who:conn.peer},conn.peer);
    }
  });
  conn.on('data',async raw=>{
    let m; try{m=JSON.parse(raw);}catch{return;}
    if(peers.has(conn.peer))peers.get(conn.peer).lastSeen=Date.now();
    if(m.t==='hello'||m.t==='beat'){ renderWitnesses(); return; }
    if(m.t==='roster'){ for(const pid of (m.peers||[])) connectTo(pid); return; }
    if(m.t==='arrive'){ if(m.who&&m.who!==MY_ID) connectTo(m.who); return; }
    if(m.t==='block'){
      if(seen.has(m.id))return; seen.add(m.id);
      let ok=true;
      if(m.sig){
        // a signed message must verify AND be fresh AND not a replay
        ok = await verify(m) && nonceFresh(m.nonce, m.ts);
      }
      if(!ok)return;
      place(m,false); broadcast(m,conn.peer);  // multi-hop flood
    }
  });
  // only drop the peer if THIS conn is still the live one — a late close from a stale
  // connection must not evict the fresh conn a reconnect just established.
  const drop=()=>{ pending.delete(conn.peer); const r=peers.get(conn.peer); if(r&&r.conn===conn)peers.delete(conn.peer); renderWitnesses(); };
  conn.on('close',drop);
  conn.on('error',drop);
}

const pending=new Set();
function connectTo(pid){
  if(!peer||pid===MY_ID||(pid===HOST_ID&&isHost)||peers.has(pid)||pending.has(pid))return null;
  try{
    const c=peer.connect(pid,{reliable:true,serialization:'json'});
    if(c){
      pending.add(pid); wire(c);
      // if it never opens, free the slot so the pursue loop can retry
      setTimeout(()=>{ if(pending.has(pid)&&!peers.has(pid)){ pending.delete(pid); try{c.close();}catch{} } },4000);
    }
    return c;
  }catch{ return null; }
}

// Guest keeps trying to reach the host until connected. It does NOT promote itself
// to host on a single miss — only if the host seat is truly empty after several tries.
let hostTries=0;
function guestPursueHost(){
  if(isHost) return;                          // we became host elsewhere
  if(peers.has(HOST_ID)){ hostTries=0; return; } // connected — done pursuing
  hostTries++;
  setStatus('joining the room… ('+hostTries+')',true);
  connectTo(HOST_ID);
  if(hostTries>=5){
    // host genuinely never answered across ~5 tries -> claim the empty seat
    hostTries=0;
    try{peer.destroy();}catch{}
    setTimeout(()=>start(true),300);
    return;
  }
  setTimeout(guestPursueHost,1200);           // retry with steady backoff
}

// ICE servers: STUN finds your address; TURN relays (DTLS-encrypted, stores nothing)
// only when a direct device-to-device punch fails. Same-network peers still go pure P2P.
// OpenRelay is a free public TURN — fine to prove cross-network works; swap for your own
// (coturn) or Cloudflare TURN once it's worth owning the relay.
const ICE = { iceServers: [
  { urls: 'stun:stun.l.google.com:19302' },
  { urls: 'stun:stun.cloudflare.com:3478' },
  { urls: 'turn:openrelay.metered.ca:80', username:'openrelayproject', credential:'openrelayproject' },
  { urls: 'turn:openrelay.metered.ca:443', username:'openrelayproject', credential:'openrelayproject' },
  { urls: 'turn:openrelay.metered.ca:443?transport=tcp', username:'openrelayproject', credential:'openrelayproject' }
] };

function start(asHost){
  isHost=asHost;
  peer=new Peer(asHost?HOST_ID:MY_ID,{debug:1, config:ICE});

  peer.on('open',()=>{
    if(asHost){ setStatus('room open · hosting · waiting for others',true); }
    else{ setStatus('joining the room…',true); hostTries=0; guestPursueHost(); }
  });

  peer.on('connection',wire);

  peer.on('error',err=>{
    if(err.type==='unavailable-id'){
      // host seat already taken -> we are a guest; connect to the existing host
      try{peer.destroy();}catch{}
      setTimeout(()=>start(false),200);
      return;
    }
    if(err.type==='peer-unavailable'){
      // a connect attempt missed. DO NOT flip roles here — guestPursueHost handles retries.
      return;
    }
    if(err.type==='network'||err.type==='server-error'||err.type==='socket-error'){
      // Broker trouble. If the mesh is still up the room WORKS — leave the live data
      // channels alone and don't alarm; the watchdog reconnects the broker in the
      // background. Only tear down and rebuild a fresh session when we're alone.
      if(peers.size>0){ return; }
      setStatus('broker unreachable · retrying…',false);
      try{peer.destroy();}catch{}
      setTimeout(()=>start(isHost),1500);
      return;
    }
    // unknown errors: surface but don't crash the room
    setStatus('mesh note: '+err.type,!!peers.size);
  });

  // The signaling link dropped. Existing WebRTC data channels survive this, so if we
  // still have peers the room is FINE — don't alarm, don't reconnect here (the watchdog
  // owns reconnection with backoff, so we never double-call or hammer the broker).
  peer.on('disconnected',()=>{ if(!peers.size) setStatus('link slipped · reconnecting…',false); });
}

// Try to BE the host at the known seat. If it's taken, the 'unavailable-id' path
// turns us into a guest that pursues the existing host. No role-flip races.
start(true);

// Reconnect watchdog — gentle and mesh-preserving. PeerJS's reconnect() can silently
// fail after the broker expires a session, so a dead session must eventually be rebuilt;
// but tearing the peer down also drops every live data channel, so we only do that when
// we're ALONE and reconnect has failed repeatedly. With peers connected we just keep
// nudging the broker back (the chat itself rides the surviving data channels). Backoff
// avoids hammering the public broker, which itself can cause more drops.
let reconnTries=0, nextTry=0;
function reconnectTick(){
  const now=Date.now();
  if(!peer){ start(isHost); return; }
  if(peer.destroyed){ if(now>=nextTry){ nextTry=now+2000; start(isHost); } return; }
  if(peer.disconnected){
    if(now<nextTry) return;
    reconnTries++;
    nextTry=now+Math.min(2000*reconnTries,15000);                 // gentle backoff
    if(peers.size>0 || reconnTries<=4){ try{peer.reconnect();}catch{} } // never tear down a live mesh
    else { reconnTries=0; nextTry=now+2000; setStatus('re-opening the channel…',false); try{peer.destroy();}catch{} setTimeout(()=>start(isHost),300); }
    return;
  }
  reconnTries=0; nextTry=0;                                        // broker is healthy
  if(isHost){ setStatus(peers.size?'hosting the room · spoken together':'room open · hosting · waiting for others',true); }
  else if(!peers.has(HOST_ID)&&hostTries===0){ guestPursueHost(); }
}
setInterval(reconnectTick,1500);

// Keep the screen awake while this tab is visible. Without it, a host phone sitting idle
// (while you use the other device) dims/locks, the browser throttles the tab, it misses
// the broker's keepalive pings and the link "slips". The lock is auto-released when the
// tab is hidden, so we re-request it whenever we become visible again.
let wakeLock=null;
async function keepAwake(){ try{ if('wakeLock' in navigator && document.visibilityState==='visible'){ wakeLock=await navigator.wakeLock.request('screen'); wakeLock.addEventListener?.('release',()=>{ wakeLock=null; }); } }catch{} }
keepAwake();
// A suspended mobile tab freezes the interval above and drops its sockets; the moment
// it's foregrounded (or the network returns) drive recovery right away rather than
// waiting for the next tick.
document.addEventListener('visibilitychange',()=>{ if(!document.hidden){ keepAwake(); reconnectTick(); } });
window.addEventListener('focus',reconnectTick);
window.addEventListener('online',reconnectTick);

// presence
const witnessEl=document.getElementById('witnesses');
function renderWitnesses(){
  for(const[pid,r]of peers){ if(!r.conn||!r.conn.open||Date.now()-r.lastSeen>PRESENCE_TTL){ try{r.conn&&r.conn.close();}catch{} peers.delete(pid); } }
  const n=peers.size+1;
  witnessEl.innerHTML=n===1?`you are the only one here · what you place will not outlast your looking`:`<b>${n}</b> saying · held directly, device to device`;
}
setInterval(()=>{ for(const r of peers.values()){ if(r.conn&&r.conn.open)try{r.conn.send(JSON.stringify({t:'beat',from:MY_ID}));}catch{} } },HEARTBEAT);
setInterval(renderWitnesses,1500); renderWitnesses();

// placing
const write=document.getElementById('write'), placeBtn=document.getElementById('place'), signBtn=document.getElementById('signToggle');
write.addEventListener('input',()=>{ placeBtn.disabled=!write.value.trim(); write.style.height='auto'; write.style.height=Math.min(write.scrollHeight,120)+'px'; });
write.addEventListener('keydown',e=>{ if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();doPlace();} });
signBtn.onclick=async()=>{ signing=!signing; if(signing)await ensureKeys(); signBtn.classList.toggle('on',signing); signBtn.textContent=signing?'\u2726 signing':'\u25CC unsigned'; };
async function doPlace(){
  const text=write.value.trim(); if(!text)return;
  const ts=Date.now(); const block={t:'block',id:rid(8),text,ts,sig:null,pub:null,nonce:null};
  if(signing){ await ensureKeys(); block.pub=myPubRaw; block.nonce=rid(8); block.sig=await sign(block); }
  seen.add(block.id); place(block,true); broadcast(block);
  write.value=''; write.style.height='auto'; placeBtn.disabled=true;
}
placeBtn.onclick=doPlace;

// share
const shareEl=document.getElementById('shareLink');
shareEl.textContent=location.href;
shareEl.onclick=async()=>{ try{ await navigator.clipboard.writeText(location.href); const old=shareEl.textContent; shareEl.textContent='copied — open it elsewhere to share the room'; setTimeout(()=>shareEl.textContent=old,1800);}catch{} };
// ====== TERMINAL SKIN OVERRIDES ======
// Re-point the display functions at the terminal UI instead of the card UI.
const scr=document.getElementById('screen');
const emptyT=document.getElementById('empty');
const inpT=document.getElementById('inp');
const sigilT=document.getElementById('sigil');
const statusT=document.getElementById('status');
const witReadout=document.getElementById('witnessReadout');
// Visible build tag — a quick way to confirm which deploy is actually loaded.
const BUILD='b10';
const buildEl=document.getElementById('build'); if(buildEl) buildEl.textContent=BUILD;

function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}

// override place(): render a terminal line that drifts away
place=function(block,mine){
  if(live.has(block.id)){ const r=live.get(block.id); r.expires=Date.now()+WITNESS_TTL; r.el.classList.remove('fading'); return; }
  const el=document.createElement('div');
  el.className='line'+(mine?' mine':'');
  const who=block.sig?`<span class="who proven">&#9670; ${esc(block.pub.slice(0,6))}</span>`:`<span class="who">&#9676; anon</span>`;
  el.innerHTML=`${who}  <span class="txt">${esc(block.text)}</span>`;
  scr.appendChild(el);
  live.set(block.id,{el,expires:Date.now()+WITNESS_TTL});
  if(block.sig){ const w=el.querySelector('.who'); voiceprint(block.pub).then(vp=>{ w.title=vp; w.style.cursor='pointer'; w.onclick=()=>{ if(w.dataset.on){ w.textContent=w.dataset.p; delete w.dataset.on; } else { w.dataset.p=w.textContent; w.dataset.on='1'; w.textContent='\u2726 '+vp; } }; }); }
  emptyT.style.display='none';
};
refreshEmpty=function(){ emptyT.style.display=live.size?'none':'flex'; };

// override setStatus()
setStatus=function(t,alive){ statusT.textContent=t; statusT.classList.toggle('alive',!!alive); };

// override renderWitnesses() -> footer readout
renderWitnesses=function(){
  for(const[pid,r]of peers){ if(!r.conn||!r.conn.open||Date.now()-r.lastSeen>PRESENCE_TTL){ try{r.conn&&r.conn.close();}catch{} peers.delete(pid); } }
  const n=peers.size+1;
  witReadout.textContent = n===1 ? 'you alone' : n+' present';
};

// wire the terminal input to the engine's doPlace()
inpT.addEventListener('keydown',e=>{
  if(e.key==='Tab'){ e.preventDefault(); signing=!signing; if(signing)showMyMark(); sigilT.className=signing?'on':''; sigilT.innerHTML=signing?'&#9670;':'&#9676;'; return; }
  if(e.key==='Enter'){ e.preventDefault(); const v=inpT.value.trim(); if(!v)return; document.getElementById('write').value=v; doPlace(); inpT.value=''; }
});
sigilT.addEventListener('click',()=>{ signing=!signing; if(signing)showMyMark(); sigilT.className=signing?'on':''; sigilT.innerHTML=signing?'&#9670;':'&#9676;'; });

// doPlace reads #write; make sure the hidden write mirrors our input at send time (done above)
// share readout
const shareT=document.getElementById('shareLink');
shareT.textContent=location.href.replace(/^https?:\/\//,'');
shareT.onclick=async()=>{ try{ await navigator.clipboard.writeText(location.href); const o=shareT.textContent; shareT.textContent='copied'; setTimeout(()=>shareT.textContent=o,1500);}catch{} };

// keep input visible when the mobile keyboard opens
if(window.visualViewport){
  window.visualViewport.addEventListener('resize',()=>{ inpT.scrollIntoView({block:'end'}); });
}
renderWitnesses();

// panic — Escape (or triple-tap the footer readout) empties the room on your side, instantly.
function panic(){ for(const r of live.values()){ try{r.el.remove();}catch{} } live.clear(); inpT.value=''; refreshEmpty(); setStatus('wiped \u00b7 the room forgets',true); }
document.addEventListener('keydown',e=>{ if(e.key==='Escape')panic(); });
let _taps=0,_tapT=null;
witReadout.addEventListener('click',()=>{ _taps++; clearTimeout(_tapT); _tapT=setTimeout(()=>_taps=0,600); if(_taps>=3){ _taps=0; panic(); } });
</script>
</body>
